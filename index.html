<script>
// === [1. 초기 설정 및 데이터] ===
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 모바일 감지 및 캔버스 리사이징
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if (isMobile) {
    document.getElementById('mobile-controls').style.display = 'flex';
    // 모바일에서는 화면을 꽉 채우거나 적절히 조절
    const resizeCanvas = () => {
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
    };
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
}

// 무기 데이터 목록
const weaponData = [
    { name: "머신건 (기본)", speed: 16, damage: 16, cooldown: 80, color: "#fff" },
    { name: "샷건 (산탄)", speed: 12, damage: 15, cooldown: 650, count: 10, color: "#f0f" },
    { name: "플라즈마 (관통)", speed: 60, damage: 40, cooldown: 400, size: 10, color: "#0af" },
    { name: "런처 (폭발)", speed: 10, damage: 150, cooldown: 1100, size: 18, color: "#ff8800", effect: 'explode' },
    { name: "스나이퍼 (저격)", speed: 50, damage: 240, cooldown: 2200, size: 6, color: "#00ff88" },
    { name: "독가스탄 (지속)", speed: 14, damage: 25, cooldown: 800, color: "#adff2f", effect: 'poison', glow: "#adff2f" },
    { name: "블랙홀건 (제어)", speed: 10, damage: 25, cooldown: 1400, size: 13, color: "#9370db", effect: 'blackhole', glow: "#9370db" },
    { name: "★ 프로스트 캐논", speed: 18, damage: 20, cooldown: 150, size: 8, color: "#00ffff", effect: 'freeze', glow: "#aaddff" },
    { name: "★ 스마트 미사일", speed: 6, damage: 38, cooldown: 550, size: 9, color: "#ffcc00", effect: 'homing', glow: "#ffaa00" },
    { name: "★ 뱀파이어 팽", speed: 22, damage: 18, cooldown: 200, size: 6, color: "#ff0000", effect: 'lifesteal', glow: "#880000" }
];

const aiWeapon = { name: "AI 라이플", speed: 14, damage: 12, cooldown: 350, color: "#aaffaa", size: 4 };

// 게임 전역 변수
let p1, p2, aiUnit;
let enemies = [], bullets = [], enemyBullets = [], items = [], clouds = [], particles = [], traps = [];
let gameActive = false, score = 0;
let lastSpawn = 0, lastBossScore = 0, shake = 0, rotAngle = 0;
let bossCount = 0, bossSpawnTimer = 0;
const keys = {}; 
let gameMode = "coop"; 
let damageTexts = []; 

function spawnDamageText(x, y, txt, color = '#fff', size = 20) {
    damageTexts.push({ x, y, txt: String(txt), color, life: 60, vy: -0.6, size });
}
function applyShake(amount) { shake = Math.max(shake, amount); }

// UI 셀렉터
const p1Sel = document.getElementById('p1-w');
const p2Sel = document.getElementById('p2-w');
const p1SubSel = document.getElementById('p1-sub');
const p2SubSel = document.getElementById('p2-sub');

weaponData.forEach((w, i) => {
    let opt = `<option value="${i}">${w.name}</option>`;
    p1Sel.innerHTML += opt; p2Sel.innerHTML += opt;
    p1SubSel.innerHTML += opt; p2SubSel.innerHTML += opt;
});
p1SubSel.value = 1; p2SubSel.value = 3;

// === [모바일 조이스틱 클래스] ===
function simKey(code, isDown) { 
    keys[code] = isDown; 
    // 특수 키(스페셜) 터치 시작 시 즉시 발동 체크
    if(isDown && gameActive) {
        if(code === 'KeyE' && p1.alive) useSpecial(p1);
        if(code === 'Period' && p2.alive && !p2.isAI) useSpecial(p2);
    }
}

class Joystick {
    constructor(zoneId, stickId, keyMap) {
        this.zone = document.getElementById(zoneId);
        this.stick = document.getElementById(stickId);
        this.keyMap = keyMap; 
        this.dragStart = null; this.touchId = null;
        
        if(this.zone) {
            this.zone.addEventListener('touchstart', this.handleStart.bind(this), {passive: false});
            this.zone.addEventListener('touchmove', this.handleMove.bind(this), {passive: false});
            this.zone.addEventListener('touchend', this.handleEnd.bind(this));
        }
    }
    handleStart(e) {
        e.preventDefault();
        const touch = e.changedTouches[0];
        this.touchId = touch.identifier;
        const rect = this.zone.getBoundingClientRect();
        this.dragStart = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
        this.handleMove(e);
    }
    handleMove(e) {
        e.preventDefault();
        const touch = Array.from(e.changedTouches).find(t => t.identifier === this.touchId);
        if (!touch || !this.dragStart) return;
        
        let dx = touch.clientX - this.dragStart.x;
        let dy = touch.clientY - this.dragStart.y;
        const maxDist = 35;
        const distance = Math.min(Math.sqrt(dx*dx + dy*dy), maxDist);
        const angle = Math.atan2(dy, dx);
        
        const stickX = Math.cos(angle) * distance;
        const stickY = Math.sin(angle) * distance;
        this.stick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;
        
        // 키 입력 시뮬레이션
        keys[this.keyMap.left] = stickX < -10;
        keys[this.keyMap.right] = stickX > 10;
        keys[this.keyMap.up] = stickY < -10;
        keys[this.keyMap.down] = stickY > 10;
    }
    handleEnd(e) {
        e.preventDefault();
        const touch = Array.from(e.changedTouches).find(t => t.identifier === this.touchId);
        if (!touch) return;
        this.stick.style.transform = `translate(-50%, -50%)`;
        this.touchId = null;
        keys[this.keyMap.left] = false; keys[this.keyMap.right] = false;
        keys[this.keyMap.up] = false; keys[this.keyMap.down] = false;
    }
}

// 조이스틱 초기화
if(isMobile) {
    new Joystick('p1-joy', 'p1-stick', {up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD'});
    new Joystick('p2-joy', 'p2-stick', {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'});
}


// === [2. 엔티티 및 게임 로직] ===
function createPlayer(x, y, color, isAI = false) {
    return { 
        x, y, vx: 0, vy: 0, speed: 1.5, friction: 0.88, size: 18, hp: 100, maxHp: 100,
        color, dir: {x:0, y:-1}, dashCd: 0, isAI, alive: true, 
        w1: weaponData[0], w2: weaponData[0], lastShot1: 0, lastShot2: -9999, invincible: 0,
        lastDamageTime: 0, frenzy: 0, specCharge: 0, specMax: 10, specType: 'nova'
    };
}

function spawnParticles(x, y, color, count = 10, type = 'normal') {
    for(let i=0; i<count; i++) {
        const speed = Math.random() * 4 + 2;
        const angle = Math.random() * Math.PI * 2;
        particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1.0, color, size: Math.random() * 4 + 2, type
        });
    }
}

function useSpecial(p) {
    if (p.specCharge < p.specMax) return;
    p.specCharge = 0; p.invincible = 30; applyShake(25);

    if (p.specType === 'nova') {
        enemyBullets = enemyBullets.filter(eb => Math.hypot(eb.x - p.x, eb.y - p.y) > 250);
        enemies.forEach(en => {
            if (Math.hypot(en.x - p.x, en.y - p.y) < 280) {
                let ang = Math.atan2(en.y - p.y, en.x - p.x);
                let power = (en.type === 'boss') ? 5 : 20;
                en.x += Math.cos(ang) * power; en.y += Math.sin(ang) * power;
                en.hp -= 100; spawnDamageText(en.x, en.y - 30, "NOVA!", "#00ffff", 24);
            }
        });
        clouds.push({ x: p.x, y: p.y, type: 'explosion', radius: 250, life: 25, color: "rgba(0, 255, 255, 0.4)" });
    } else if (p.specType === 'mine') {
        spawnDamageText(p.x, p.y - 40, "MINES!", "#ffff00", 24);
        for(let i=0; i<3; i++) {
            let baseAng = Math.atan2(p.dir.y, p.dir.x) + Math.PI; 
            let ang = baseAng + (i-1)*0.5;
            let tx = Math.max(20, Math.min(canvas.width - 20, p.x + Math.cos(ang)*40));
            let ty = Math.max(20, Math.min(canvas.height - 20, p.y + Math.sin(ang)*40));
            traps.push({ x: tx, y: ty, radius: 120, damage: 300, active: false, life: 1200, color: "#ffaa00", armTimer: 60 });
        }
    } else if (p.specType === 'slash') {
        let baseAngle = Math.atan2(p.dir.y, p.dir.x);
        for(let i=0; i<20; i++) particles.push({ x: p.x, y: p.y, vx: Math.cos(baseAngle)*15, vy: Math.sin(baseAngle)*15, life: 0.8, color: "#fff", size: 4, type: 'slash' });
        enemies.forEach(en => {
            let angToEn = Math.atan2(en.y - p.y, en.x - p.x);
            let diff = Math.abs(baseAngle - angToEn);
            if (diff > Math.PI) diff = 2*Math.PI - diff;
            if (diff < 1.0 && Math.hypot(en.x - p.x, en.y - p.y) < 220) {
                en.hp -= 400; spawnDamageText(en.x, en.y - 40, "SLASH!", "#ffffff", 28);
                spawnParticles(en.x, en.y, "#fff", 15);
            }
        });
        enemyBullets = enemyBullets.filter(eb => {
             let diff = Math.abs(baseAngle - Math.atan2(eb.y-p.y, eb.x-p.x));
             if(diff > Math.PI) diff = 2*Math.PI - diff;
             return !(diff < 1.5 && Math.hypot(eb.x-p.x, eb.y-p.y) < 150);
        });
    }
}

function spawnEnemy(isBoss = false) {
    const side = Math.floor(Math.random() * 4);
    let x, y;
    if(side === 0) { x = Math.random() * canvas.width; y = -50; }
    else if(side === 1) { x = canvas.width + 50; y = Math.random() * canvas.height; }
    else if(side === 2) { x = Math.random() * canvas.width; y = canvas.height + 50; }
    else { x = -50; y = Math.random() * canvas.height; }

    const difficulty = 1 + score / 2000;
    
    if(isBoss) {
        enemies.push({ x, y, hp: 800 * difficulty, maxHp: 800*difficulty, speed: 0.5, baseSpeed: 0.5, size: 50, color: "#ff0044", type: 'boss', lastShot: 0, frozen: 0 });
        bossSpawnTimer = 150;
    } else {
        const rand = Math.random();
        let type = 'chaser', color = `hsl(${Math.random()*360}, 60%, 50%)`, hp = 35 * difficulty, speed = 1.3 * Math.min(difficulty, 2), size = 20;

        if (bossCount >= 2 && rand < 0.15) { type = 'spider'; color = "#e0e0e0"; hp = 60 * difficulty; speed = 1.1; size = 22; } 
        else if (bossCount >= 2 && rand < 0.35) { type = 'bomber'; color = "#ff4400"; hp = 20 * difficulty; speed = 1.3 * Math.min(difficulty, 2); size = 16; } 
        else if (bossCount >= 1 && rand < 0.25) { type = 'guardian'; color = "#5588ff"; hp = 140 * difficulty; speed = 0.5; size = 26; } 
        else if (rand < 0.4) { 
            if(rand < 0.1) { type = 'shotgunner'; color = "#a020f0"; hp = 90 * difficulty; }
            else { type = 'shooter'; color = "#ffff00"; hp = 25 * difficulty; speed = 0.8; }
        }
        enemies.push({ x, y, hp, maxHp: hp, speed, baseSpeed: speed, size, color, type, lastShot: 0, frozen: 0, poison: 0, _poisonAccum: 0, _poisonDispCounter: 0 });
    }
}

function useBomb() {
    applyShake(30);
    for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].type !== 'boss') { 
        spawnParticles(enemies[i].x, enemies[i].y, enemies[i].color, 15);
        score += 15; enemies.splice(i, 1); 
    }
}

function startGame() {
    // 분석 코드 추가: 누가 시작 버튼을 눌렀나?
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({'event': 'game_start'});

    document.getElementById('menu').style.display = 'none';
    gameState = 'playing';

    gameMode = document.getElementById('mode-select').value || "coop";
    p1 = createPlayer(canvas.width/2 - 80, canvas.height/2, '#ff4444');
    p2 = createPlayer(canvas.width/2 + 80, canvas.height/2, '#4444ff');
    aiUnit = createPlayer(canvas.width/2, canvas.height/2 + 80, '#00ff88', true);
    
    p1.w1 = weaponData[p1Sel.value]; p1.w2 = weaponData[p1SubSel.value];
    p2.w1 = weaponData[p2Sel.value]; p2.w2 = weaponData[p2SubSel.value];
    p1.specType = document.getElementById('p1-spec').value;
    p2.specType = document.getElementById('p2-spec').value;
    aiUnit.w1 = aiWeapon; aiUnit.w2 = aiWeapon; 

    if (gameMode === "solo") {
        p2.isAI = true; p2.color = "#00ff88"; 
        document.getElementById('p2-label').innerText = "P2 (AI)";
        document.getElementById('p2-hp-fill').style.background = "#00ff88";
    } else {
        p2.isAI = false;
        document.getElementById('p2-label').innerText = "P2 (BLUE)";
        document.getElementById('p2-hp-fill').style.background = "#4444ff";
    }

    enemies = []; bullets = []; enemyBullets = []; items = []; clouds = []; particles = []; traps = [];
    score = 0; lastBossScore = 0; bossCount = 0; bossSpawnTimer = 0;
    gameActive = true;
    document.getElementById('menu').style.display = 'none';
    requestAnimationFrame(update);
}

// 키보드 & 조이스틱 공유
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (gameActive) {
        if (e.code === 'KeyE' && p1.alive) useSpecial(p1);
        if (e.code === 'Period' && p2.alive && !p2.isAI) useSpecial(p2);
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function fireWeapon(p, weapon, slot) {
    const now = Date.now();
    const lastShotKey = slot === 1 ? 'lastShot1' : 'lastShot2';
    let finalCooldown = weapon.cooldown;
    if(p.isAI) finalCooldown += 100;
    if (p.frenzy > 0) finalCooldown /= 2;

    if (now - p[lastShotKey] > finalCooldown) {
        const count = weapon.count || 1;
        for(let i=0; i<count; i++) {
            let baseAngle = Math.atan2(p.dir.y, p.dir.x);
            if (p.isAI) baseAngle += (Math.random() - 0.5) * 0.5;
            let angle = baseAngle + (count > 1 ? (i - (count-1)/2)*0.25 : 0);
            bullets.push({ 
                x: p.x, y: p.y, vx: Math.cos(angle)*weapon.speed, vy: Math.sin(angle)*weapon.speed, 
                damage: weapon.damage, color: weapon.color, size: weapon.size || 5, glow: weapon.glow,
                effect: weapon.effect, owner: p, life: weapon.range ? weapon.range / weapon.speed : 120
            });
        }
        p[lastShotKey] = now;
    }
}

function handleAI(p) {
    if (!p.alive) return;
    let nearest = null; let minDist = Infinity;
    enemies.forEach(en => { let d = Math.hypot(en.x - p.x, en.y - p.y); if(d < minDist) { minDist = d; nearest = en; } });
    if (nearest) {
        let targetAngle = Math.atan2(nearest.y - p.y, nearest.x - p.x);
        p.vx += Math.cos(targetAngle) * 0.3; p.vy += Math.sin(targetAngle) * 0.3;
        p.dir = {x: Math.cos(targetAngle), y: Math.sin(targetAngle)};
        fireWeapon(p, p.w1, 1);
    }
}

function handleInput(p, up, down, left, right, shoot1, dashKey, shoot2) {
    if (keys[up]) p.vy -= p.speed; if (keys[down]) p.vy += p.speed;
    if (keys[left]) p.vx -= p.speed; if (keys[right]) p.vx += p.speed;
    if (keys[dashKey] && p.dashCd <= 0) { p.vx *= 12; p.vy *= 12; p.dashCd = 45; p.invincible = 10; }
    if (Math.abs(p.vx) > 0.1 || Math.abs(p.vy) > 0.1) p.dir = {x: p.vx, y: p.vy};
    if (keys[shoot1]) fireWeapon(p, p.w1, 1);
    if (keys[shoot2]) fireWeapon(p, p.w2, 2);
}

function showShareModal() {
    document.getElementById('share-modal').style.display = 'block';
    document.getElementById('final-score-text').innerText = `${score.toLocaleString()} SCORE`;
}

function copyShareText() {
    const gameUrl = "https://suuger.github.io/shooting/";
    const shareMessage = `[2P Hardcore Arena]\n"이 아레나에서 살아남을 수 있겠나?"\n\n🏆 내 생존 기록: ${score.toLocaleString()}점\n🚀 지금 바로 도전하기: ${gameUrl}`;
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareMessage).then(() => alert("기록과 주소가 복사되었습니다!"));
    } else {
        const textArea = document.createElement("textarea");
        textArea.value = shareMessage; document.body.appendChild(textArea);
        textArea.select(); document.execCommand('copy'); document.body.removeChild(textArea);
        alert("기록이 복사되었습니다!");
    }
}

function update(time) {
    if (!gameActive) return;
    rotAngle += 0.05;

    handleInput(p1, 'KeyW', 'KeyS', 'KeyA', 'KeyD', 'Space', 'ShiftLeft', 'KeyQ');
    if (gameMode === "coop") {
        handleInput(p2, 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'ControlRight', 'Slash');
    } else if (p2 && p2.alive) handleAI(p2);
    handleAI(aiUnit);

    if (score - lastBossScore >= 600) { spawnEnemy(true); lastBossScore = score; }
    if (time - lastSpawn > Math.max(400, (2500 - score/12) - (bossCount * 150))) { spawnEnemy(); lastSpawn = time; }

    [p1, p2, aiUnit].forEach(p => {
        if (!p.alive) return;
        p.dashCd--; p.invincible--; if(p.frenzy > 0) p.frenzy--; 
        p.x += p.vx; p.y += p.vy; p.vx *= p.friction; p.vy *= p.friction;
        p.x = Math.max(p.size, Math.min(canvas.width - p.size, p.x));
        p.y = Math.max(p.size, Math.min(canvas.height - p.size, p.y));
        if (Date.now() - p.lastDamageTime > 10000 && p.hp < p.maxHp) {
            p.hp = Math.min(p.maxHp, p.hp + 0.07);
            if (Math.random() < 0.1) particles.push({x:p.x, y:p.y-10, vx:0, vy:-1, life:0.6, color:"#00ff88", size:3, type:'heal_spark'});
        }
    });

    for (let i = traps.length - 1; i >= 0; i--) {
        let t = traps[i]; t.life--; t.armTimer--;
        if (t.armTimer <= 0) t.active = true;
        if (t.active) {
            let triggered = false;
            enemies.forEach(en => { if (!triggered && en.hp > 0 && Math.hypot(en.x - t.x, en.y - t.y) < 40) triggered = true; });
            if (triggered) {
                applyShake(15);
                clouds.push({ x: t.x, y: t.y, type: 'explosion', radius: t.radius, life: 15, color: "rgba(255,100,0,0.6)" });
                enemies.forEach(en => {
                    if (Math.hypot(en.x - t.x, en.y - t.y) < t.radius) {
                        en.hp -= t.damage; spawnDamageText(en.x, en.y - 30, "-" + t.damage, "#ff8800", 20);
                    }
                });
                t.life = 0;
            }
        }
        if (t.life <= 0) traps.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        let pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.92; pt.vy *= 0.92; pt.life -= 0.03; pt.size *= 0.95; 
        if (pt.life <= 0) particles.splice(i, 1);
    }

    for (let i = clouds.length - 1; i >= 0; i--) {
        let c = clouds[i]; c.life--; c._pulse = (c._pulse || 0) + 0.06;
        enemies.forEach(en => {
            if (Math.hypot(en.x - c.x, en.y - c.y) < c.radius) {
                if (c.type === 'poison') { 
                    en.poison = 60; en.hp -= 0.6; en._poisonAccum = (en._poisonAccum||0) + 0.6;
                    if ((en._poisonDispCounter = (en._poisonDispCounter||0)+1) >= 6 && en._poisonAccum >= 1) {
                        spawnDamageText(en.x, en.y-20, "-" + Math.floor(en._poisonAccum), "#aaff66", 14); en._poisonAccum=0; en._poisonDispCounter=0;
                    }
                }
                if (c.type === 'blackhole') { let a = Math.atan2(c.y-en.y, c.x-en.x); en.x += Math.cos(a)*3.5; en.y += Math.sin(a)*3.5; en.hp-=0.2; }
            }
        });
        if (c.life <= 0) clouds.splice(i, 1);
    }

    for (let i = items.length - 1; i >= 0; i--) {
        let it = items[i], picker = null;
        [p1, p2].forEach(p => { if (p.alive && Math.hypot(it.x - p.x, it.y - p.y) < p.size + 15) picker = p; });
        if (picker) {
            if (it.type === 'heal') { picker.hp = Math.min(100, picker.hp + 50); spawnDamageText(picker.x, picker.y-20, "+50", "#88ff88", 22); if (!aiUnit.alive) { aiUnit.alive=true; aiUnit.hp=100; aiUnit.x=picker.x; aiUnit.y=picker.y; } }
            else if (it.type === 'bomb') useBomb();
            else if (it.type === 'random') {
                applyShake(20); picker.hp = picker.maxHp; enemies.forEach(e => e.frozen = 300); picker.frenzy = 600;
                if (!aiUnit.alive) { aiUnit.alive=true; aiUnit.hp=100; aiUnit.x=picker.x; aiUnit.y=picker.y; }
                spawnDamageText(picker.x, picker.y-20, "SUPER BOX!", "#ffd700", 30);
            }
            items.splice(i, 1);
        }
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i]; 
        if (b.effect === 'homing') {
            let nearest = null, minD = 400; enemies.forEach(en => { let d = Math.hypot(en.x-b.x, en.y-b.y); if(d<minD) { minD=d; nearest=en; } });
            if (nearest) {
                let ta = Math.atan2(nearest.y-b.y, nearest.x-b.x), ca = Math.atan2(b.vy, b.vx);
                let nx = Math.cos(ta)*0.5 + Math.cos(ca)*6, ny = Math.sin(ta)*0.5 + Math.sin(ca)*6;
                let len = Math.hypot(nx, ny); b.vx = (nx/len)*7; b.vy = (ny/len)*7;
            }
        }
        b.x += b.vx; b.y += b.vy; b.life--;
        let rem = false;
        if (b.life <= 0) {
            if (b.effect === 'explode') { applyShake(10); clouds.push({ x:b.x, y:b.y, type:'explosion', radius:40, life:10, color:"rgba(255,100,0,0.5)" }); enemies.forEach(e=>{if(Math.hypot(e.x-b.x, e.y-b.y)<130) e.hp-=150;}); }
            rem = true;
        }
        if (!rem) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let en = enemies[j];
                if (Math.hypot(b.x - en.x, b.y - en.y) < en.size + b.size + 8) {
                    en.hp -= b.damage; spawnDamageText(en.x, en.y-20, "-"+Math.floor(b.damage), b.color, 16);
                    if (b.effect === 'lifesteal' && b.owner && b.owner.alive) b.owner.hp = Math.min(b.owner.maxHp, b.owner.hp + 2);
                    if (b.effect === 'freeze') en.frozen = 180;
                    if (b.effect !== 'fire') rem = true;
                    if (rem) {
                        if (b.effect === 'poison') clouds.push({x:b.x, y:b.y, type:'poison', radius:90, life:150, color:"rgba(173,255,47,0.25)"});
                        if (b.effect === 'blackhole') clouds.push({x:b.x, y:b.y, type:'blackhole', radius:160, life:200, color:"rgba(147,112,219,0.2)"});
                        if (b.effect === 'explode') { applyShake(10); enemies.forEach(e=>{if(Math.hypot(e.x-b.x, e.y-b.y)<110) e.hp-=80;}); }
                    }
                    if (en.hp <= 0) {
                        spawnParticles(en.x, en.y, en.color, en.size/2);
                        if (b.owner) b.owner.specCharge = Math.min(b.owner.specMax, b.owner.specCharge + 1);
                        if (en.type === 'spider') for(let k=0; k<3; k++) enemies.push({x:en.x, y:en.y, hp:15, maxHp:15, speed:2.2, baseSpeed:2.2, size:10, color:"#ccc", type:'spiderling', frozen:0, vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5});
                        if (en.type === 'boss') { 
                            bossCount++; applyShake(40); items.push({x:en.x, y:en.y, type:'random'}); if(b.owner) b.owner.specCharge=b.owner.specMax;
                        } else {
                            if(Math.random()<0.01) items.push({x:en.x, y:en.y, type:'random'});
                            else if(Math.random()<0.05) items.push({x:en.x, y:en.y, type:'heal'});
                            else if(Math.random()<0.07) items.push({x:en.x, y:en.y, type:'bomb'});
                        }
                        score += en.type==='boss'?200:15; enemies.splice(j, 1);
                        document.getElementById('score-board').innerText = "SCORE: " + score;
                    }
                    if (rem) break;
                }
            }
        }
        if (rem || b.x < -100 || b.x > canvas.width+100 || b.y < -100 || b.y > canvas.height+100) bullets.splice(i, 1);
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i]; eb.x += eb.vx; eb.y += eb.vy;
        [p1, p2, aiUnit].forEach(p => {
            if (p.alive && Math.hypot(eb.x - p.x, eb.y - p.y) < p.size + eb.size) {
                if (p.invincible <= 0) { 
                    p.hp -= 10; p.lastDamageTime = Date.now(); applyShake(10); spawnDamageText(p.x, p.y-20, "-10", "#ffbbbb", 16);
                    if (p.isAI && p.hp <= 0) p.alive = false;
                }
                enemyBullets.splice(i, 1);
            }
        });
        if (eb && (eb.x < -50 || eb.x > canvas.width+50 || eb.y < -50 || eb.y > canvas.height+50)) enemyBullets.splice(i, 1);
    }

    enemies.forEach(en => {
        if (en.type === 'spiderling' && en.vx) { en.x+=en.vx; en.y+=en.vy; en.vx*=0.9; en.vy*=0.9; if(Math.abs(en.vx)<0.1) en.vx=0; }
        let targets = [p1, p2, aiUnit].filter(t => t.alive);
        if (targets.length === 0) return;
        let target = targets.sort((a,b) => Math.hypot(en.x-a.x, en.y-a.y) - Math.hypot(en.x-b.x, en.y-b.y))[0];
        let dist = Math.hypot(target.x - en.x, target.y - en.y);
        let angle = Math.atan2(target.y - en.y, target.x - en.x);
        en.angle = angle;
        let cspd = en.speed; if(en.frozen>0) { cspd*=0.5; en.frozen--; }

        if (en.type === 'bomber' && dist < en.size+target.size+20) {
            applyShake(20); clouds.push({x:en.x, y:en.y, type:'explosion', radius:110, life:15, color:"rgba(255,50,0,0.6)"});
            targets.forEach(t=>{if(Math.hypot(t.x-en.x, t.y-en.y)<110) { let dmg=Math.ceil(t.maxHp*0.45); t.hp-=dmg; spawnDamageText(t.x, t.y-20, "-"+dmg, "#ffddbb", 16); }});
            en.hp = -999;
        }
        if (en.type === 'shooter') {
            if(dist>320) {en.x+=Math.cos(angle)*cspd; en.y+=Math.sin(angle)*cspd;} else if(dist<250) {en.x-=Math.cos(angle)*cspd; en.y-=Math.sin(angle)*cspd;}
            if(time-en.lastShot>1900) { enemyBullets.push({x:en.x, y:en.y, vx:Math.cos(angle)*5, vy:Math.sin(angle)*5, size:6}); en.lastShot=time; }
        } else if (en.type === 'shotgunner') {
            en.x+=Math.cos(angle)*cspd; en.y+=Math.sin(angle)*cspd;
            if(dist<320 && time-en.lastShot>2500) { for(let i=-2; i<=2; i++) {let sa=angle+i*0.2; enemyBullets.push({x:en.x, y:en.y, vx:Math.cos(sa)*6, vy:Math.sin(sa)*6, size:5});} en.lastShot=time; }
        } else if(en.type !== 'bomber') { en.x+=Math.cos(angle)*cspd; en.y+=Math.sin(angle)*cspd; }

        let dmg = en.type==='boss'?0.8 : (en.type==='guardian'?0.2:0.4);
        if (dist < en.size + target.size && target.invincible <= 0) { 
            target.hp -= dmg; target.lastDamageTime = Date.now(); applyShake(2); spawnDamageText(target.x, target.y-20, "-"+Math.ceil(dmg), "#ffeedd", 12);
            if (target.isAI && target.hp <= 0) target.alive = false; 
        }
        if(en.poison>0) en.poison--;
    });

    document.getElementById('p1-hp-fill').style.width = Math.max(0, p1.hp) + "%";
    document.getElementById('p2-hp-fill').style.width = Math.max(0, p2.hp) + "%";
    document.getElementById('p1-sub-fill').style.width = Math.min(100, (Date.now()-p1.lastShot2)/p1.w2.cooldown*100) + "%";
    document.getElementById('p2-sub-fill').style.width = Math.min(100, (Date.now()-p2.lastShot2)/p2.w2.cooldown*100) + "%";
    document.getElementById('p1-spec-fill').style.width = (p1.specCharge/p1.specMax*100) + "%";
    document.getElementById('p2-spec-fill').style.width = (p2.specCharge/p2.specMax*100) + "%";

    if ((gameMode === "coop" && (p1.hp <= 0 || p2.hp <= 0)) || (gameMode === "solo" && p1.hp <= 0)) {
        // [추가] 구글 애널리틱스(GTM)로 게임 종료 이벤트와 점수 전송
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            'event': 'game_over',
            'final_score': score,
            'game_mode': gameMode
        });

        gameActive = false;
        showShareModal();
        return;
    }

    for (let i = damageTexts.length - 1; i >= 0; i--) {
        let t = damageTexts[i]; t.x+=(Math.random()-0.5)*0.4; t.y+=t.vy; t.vy-=0.02; t.life--;
        if (t.life <= 0) damageTexts.splice(i,1);
    }
    draw();
    requestAnimationFrame(update);
}

function draw() {
    ctx.save(); if (shake > 0) { ctx.translate(Math.random()*shake-shake/2, Math.random()*shake-shake/2); shake *= 0.88; if(shake<0.2) shake=0; }
    ctx.fillStyle = "rgba(5, 5, 5, 0.5)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    traps.forEach(t => {
        ctx.save(); ctx.translate(t.x, t.y);
        ctx.fillStyle = t.active ? "#ff0000" : "#aaaa00"; if (!t.active) ctx.globalAlpha = 0.5;
        if (t.active && Math.floor(Date.now()/200)%2===0) ctx.fillStyle = "#ffaa00";
        ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = t.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0,0,15+Math.sin(Date.now()/100)*3, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = "rgba(255, 100, 0, 0.2)"; ctx.beginPath(); ctx.arc(0,0, t.radius, 0, Math.PI*2); ctx.stroke(); ctx.restore();
    });

    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.beginPath();
        if(p.type==='heal_spark') { ctx.fillRect(p.x-p.size/2, p.y-p.size/6, p.size, p.size/3); ctx.fillRect(p.x-p.size/6, p.y-p.size/2, p.size/3, p.size); }
        else if(p.type==='slash') { ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+p.vx*3, p.y+p.vy*3); ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.stroke(); }
        else { ctx.rect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); ctx.fill(); }
    });
    ctx.globalAlpha = 1.0;

    clouds.forEach(c => {
        ctx.save();
        const rad = c.radius * (c._pulse ? (1+0.03*Math.sin(c._pulse)) : 1);
        let grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, rad);
        grad.addColorStop(0, c.color); grad.addColorStop(0.6, c.color); grad.addColorStop(1, "transparent");
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(c.x, c.y, rad, 0, Math.PI*2); ctx.fill(); ctx.restore();
    });

    items.forEach(it => {
        ctx.shadowBlur = 15;
        if(it.type === 'heal') { ctx.fillStyle = "#00ff88"; ctx.fillRect(it.x-10, it.y-10, 20, 20); ctx.fillStyle="white"; ctx.fillRect(it.x-2, it.y-7, 4,14); ctx.fillRect(it.x-7, it.y-2, 14, 4); }
        else if(it.type === 'random') { ctx.fillStyle = "#ffd700"; ctx.fillRect(it.x-12, it.y-12, 24, 24); ctx.fillStyle="#000"; ctx.font="bold 20px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("?", it.x, it.y); }
        else { ctx.fillStyle = "#ff0044"; ctx.fillRect(it.x-10, it.y-10, 20, 20); ctx.strokeStyle="white"; ctx.strokeRect(it.x-6, it.y-6, 12, 12); }
    });

    bullets.forEach(b => { ctx.fillStyle = b.color; ctx.shadowBlur = b.glow?15:5; ctx.shadowColor = b.glow||b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill(); });
    enemyBullets.forEach(eb => { ctx.fillStyle = "#ff2200"; ctx.shadowBlur = 10; ctx.shadowColor = "red"; ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.size, 0, Math.PI*2); ctx.fill(); });

    enemies.forEach(en => {
        if(en.type==='spider') {
            ctx.shadowBlur=10; ctx.shadowColor=en.color; ctx.fillStyle=en.color; ctx.beginPath();
            let a=en.angle||0; ctx.moveTo(en.x+Math.cos(a)*en.size, en.y+Math.sin(a)*en.size);
            ctx.lineTo(en.x+Math.cos(a+2.6)*en.size, en.y+Math.sin(a+2.6)*en.size);
            ctx.lineTo(en.x+Math.cos(a-2.6)*en.size, en.y+Math.sin(a-2.6)*en.size); ctx.fill();
        } else {
            if(en.type==='shooter' || en.type==='shotgunner') {
                ctx.save(); ctx.translate(en.x, en.y); ctx.rotate(rotAngle); ctx.strokeStyle=en.color; ctx.lineWidth=2; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.arc(0, 0, en.size+8, 0, Math.PI*2); ctx.stroke(); ctx.restore();
            }
            ctx.fillStyle = en.frozen>0?"#00ffff":en.color; ctx.shadowBlur=10; ctx.shadowColor=en.color;
            ctx.beginPath(); ctx.arc(en.x, en.y, en.size, 0, Math.PI*2); ctx.fill();
        }
        if(en.type==='guardian') { ctx.save(); ctx.translate(en.x, en.y); ctx.rotate(en.angle||0); ctx.beginPath(); ctx.arc(0,0,en.size+6, -Math.PI/2, Math.PI/2); ctx.lineWidth=5; ctx.strokeStyle="#4488ff"; ctx.stroke(); ctx.restore(); }
        if(en.type==='boss') { ctx.fillStyle="#222"; ctx.fillRect(en.x-40, en.y-en.size-20, 80, 8); ctx.fillStyle="#f00"; ctx.fillRect(en.x-40, en.y-en.size-20, 80*(en.hp/en.maxHp), 8); }
        ctx.shadowBlur=0;
    });

    [p1, p2, aiUnit].forEach(p => {
        if (!p.alive) return;
        ctx.globalAlpha = p.invincible>0 && Math.floor(Date.now()/50)%2===0 ? 0.5 : 1.0;
        ctx.shadowBlur = p.specCharge>=p.specMax ? 20 : (p.frenzy>0 ? 25 : 15);
        ctx.shadowColor = p.specCharge>=p.specMax ? "#00ffff" : (p.frenzy>0 ? "#ff0000" : p.color);
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        let a = Math.atan2(p.dir.y, p.dir.x); ctx.strokeStyle="white"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+Math.cos(a)*25, p.y+Math.sin(a)*25); ctx.stroke();
        
        let bx=p.x-20, by=p.y-p.size-18;
        ctx.shadowBlur=0; ctx.fillStyle="#222"; ctx.fillRect(bx, by, 40, 6);
        ctx.fillStyle=p.color; ctx.fillRect(bx, by, 40*(p.hp/p.maxHp), 6);
    });
    ctx.globalAlpha = 1.0;

    if (bossSpawnTimer > 0) {
        bossSpawnTimer--; ctx.fillStyle="rgba(0,0,0,0.4)"; ctx.fillRect(0,0,canvas.width,canvas.height);
        if(bossSpawnTimer%20<10) { ctx.fillStyle="red"; ctx.font="900 60px sans-serif"; ctx.textAlign="center"; ctx.fillText("⚠ WARNING ⚠", canvas.width/2, canvas.height/2); }
    }

    damageTexts.forEach(t => {
        ctx.font = `${t.size}px Pretendard, sans-serif`; ctx.textAlign='center'; ctx.globalAlpha=t.life/60; ctx.fillStyle=t.color; ctx.fillText(t.txt, t.x, t.y);
    });
    ctx.globalAlpha=1.0; ctx.restore();
}
</script>
